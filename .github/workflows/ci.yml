name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-take every visual baseline (after an intended visual change): run from the Actions
  # tab, then download the "visual-baselines" artifact and commit it (e2e/README.md).
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-take all visual baselines"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: corepack enable pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Exercise answers are verified with real Python (pnpm content:verify, unit tests).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Code exercises' reference solutions use numpy and pandas (Phase 13).
      - run: python -m pip install --quiet numpy pandas

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm content:verify
      - run: pnpm content:qa
      - run: pnpm test:coverage

  e2e:
    # The public Playwright suite, split across runners (Phase 20: one runner took 21 min).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: corepack enable pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      # Every public content page is prerendered (Phase 20c).
      - if: matrix.shard == 1
        run: pnpm check:static

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  visual:
    # Screenshots of key pages in both themes against the committed Linux baselines
    # (e2e/visual.spec.ts). Missing baselines are written, uploaded, and fail the job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: corepack enable pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Compare screenshots
        env:
          VISUAL: "1"
        run: |
          mode=missing
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then mode=all; fi
          pnpm exec playwright test e2e/visual.spec.ts --update-snapshots=$mode
      - name: New or re-taken baselines
        id: baselines
        if: always()
        run: |
          changes=$(git status --porcelain -- e2e/__screenshots__)
          echo "$changes"
          if [ -n "$changes" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: always() && steps.baselines.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          retention-days: 7
      - if: always() && steps.baselines.outputs.changed == 'true' && inputs.update_snapshots != true
        run: |
          echo "::error::Visual baselines were missing: review the visual-baselines artifact and commit it."
          exit 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7

  db:
    # Migrations, RLS and account tests against a real local Supabase stack, then the
    # signed-in end-to-end flows against a build pointed at it.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: corepack enable pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (Postgres, auth, REST, gateway, mail catcher; migrations + seed applied)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - name: Generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/db/database.types.ts || {
            echo "::error::src/lib/db/database.types.ts is stale. Run 'pnpm db:types' and commit it."
            exit 1
          }

      - run: pnpm test:db

      # Signed-in end-to-end flows (Phase 17c): a build pointed at this stack.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e:db

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-db
          path: |
            playwright-report-db/
            test-results/
          retention-days: 7
