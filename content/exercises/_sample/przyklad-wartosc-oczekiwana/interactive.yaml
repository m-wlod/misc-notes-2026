# SAMPLE (Phase 8): demonstrates the exercise engine. Not course content.
id: przyklad-suwak
type: interactive
level: 1
topics: [przyklad]
lessonIds: [przyklad-wartosc-oczekiwana]
estimatedMinutes: 1
status: draft
sample: true
interview: [sprint]
prompt:
  pl: "Przykład: ustaw suwak dokładnie w połowie zakresu."
  en: "Sample: set the slider exactly halfway along its range."
params: { min: 0, max: 10, step: 0.5 }
answer: 5
tolerance: 0.25
widget: slider
hints:
  - pl: "Połowa to średnia końców zakresu."
    en: "Halfway is the average of the two ends."
solution:
  pl: "$(0 + 10) / 2 = 5$."
  en: "$(0 + 10) / 2 = 5$."
verify: |
  result = (min + max) / 2
