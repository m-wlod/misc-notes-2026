solution:
  pl: '`df["close"].pct_change().dropna().mean()`: zmiana procentowa dzień do dnia, bez pierwszego dnia, uśredniona.'
  en: '`df["close"].pct_change().dropna().mean()`: the day-to-day percentage change, without the first day, averaged.'
