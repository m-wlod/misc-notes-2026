# SAMPLE (Phase 8): demonstrates the exercise engine. Not course content.
id: przyklad-kod
type: code
level: 1
topics: [przyklad]
lessonIds: [przyklad-wartosc-oczekiwana]
estimatedMinutes: 1
status: draft
sample: true
prompt:
  pl: "Przykład: napisz funkcję, która podwaja liczbę."
  en: "Sample: write a function that doubles a number."
starter: |
  def double(x):
      ...
examples: |
  assert double(3) == 6
tests:
  - code: assert double(2) == 4
    message:
      pl: "double(2) powinno dać 4."
      en: "double(2) should be 4."
  - code: assert double(-1.5) == -3
    message:
      pl: "Liczby ujemne i ułamki też: double(-1,5) to -3."
      en: "Negative numbers and fractions too: double(-1.5) is -3."
solutionCode: |
  def double(x):
      return 2 * x
hints:
  - pl: "Pomnóż argument przez 2."
    en: "Multiply the argument by 2."
solution:
  pl: "Funkcja zwraca 2 razy x."
  en: "The function returns 2 times x."
