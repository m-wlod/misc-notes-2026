prompt:
  pl: "Przykład: wyjaśnij własnymi słowami, czym jest średnia."
  en: "Sample: explain in your own words what an average is."
rubric:
  - pl: "Mówi, że wartości się sumuje"
    en: "Says the values are added up"
  - pl: "Mówi, że sumę dzieli się przez liczbę wartości"
    en: "Says the sum is divided by the number of values"
hints:
  - pl: "Pomyśl o dzieleniu sumy."
    en: "Think about dividing a sum."
solution:
  pl: "Średnia to suma wartości podzielona przez ich liczbę."
  en: "The average is the sum of the values divided by how many there are."
