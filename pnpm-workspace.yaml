allowBuilds:
  esbuild: false
  # posthog-js > core-js: its postinstall only prints a message
  core-js: false
  sharp: false
  unrs-resolver: false
  # next-intl extractor deps; not used at runtime, native binaries come from optional platform packages
  "@parcel/watcher": false
  "@swc/core": false
# Security (Phase 21, `pnpm audit`): patched versions of transitive dependencies.
overrides:
  # velite > sharp: CVEs in bundled libvips/librsvg fixed in 0.35.5 (build-time image tool).
  sharp: ^0.35.5
  # remark-math / rehype-katex > katex: the app already uses katex 0.19.
  katex: ^0.19.1
